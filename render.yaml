services:
  - type: web
    name: resolvedesk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SEED_DEMO
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AGENT_MODE
        value: llm
      - key: LLM_PROVIDER
        value: gemini
      - key: OPENAI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: CLOUD_API_ENABLED
        value: "true"
      - key: EMBEDDINGS_ENABLED
        value: "true"
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: LANGSMITH_TRACING
        value: "false"
